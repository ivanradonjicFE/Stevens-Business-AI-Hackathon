[project]
name = "watchtower"
version = "0.1.0"
description = "Supply-shock early-warning terminal: correlates public news, weather, and hazard signals into scored events with historical analogs"
readme = "README.md"
authors = [
    { name = "dramfin", email = "20ramirez.diego03@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

# Optional: enables the LLM path of the agent council. Without it the
# council still runs, on its deterministic rule fallback.
[project.optional-dependencies]
ai = ["openai>=1.40"]

[project.scripts]
watchtower = "watchtower:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
]
