      memory: [MU]
      equipment: [ASML, AMAT, LRCX, KLAC, TER, ENTG]
      eda: [SNPS, CDNS]
      packaging: [ASX]
      systems: [SMCI]
    node_kinds: [fab, canal, strait, port, material, osat]
