# Market verticals. Semiconductor is fully built; others demonstrate
# that the pipeline is config-driven and extensible.
#
# watchlist: every name monitored for the vertical (shown when a panel
#            is too short for the full segment breakdown).
# segments:  the same names grouped by supply-chain role, which is what
#            the dashboard watchlist panel renders.

markets:
